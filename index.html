<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BC Phoenix – Spieltage abonnieren</title>
  <style>
    :root{color-scheme:dark;--bg:#10191b;--card:#1d2a2d;--green:#57e389;--text:#f4f8f5;--muted:#b9c6be}
    *{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:linear-gradient(145deg,#102b24,#10191b 45%);color:var(--text)}
    main{max-width:760px;margin:auto;padding:40px 20px 56px}h1{margin:0;font-size:clamp(2rem,7vw,3.4rem)}h1 span{color:var(--green)}
    .lead{color:var(--muted);margin:12px 0 28px;font-size:1.12rem}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
    .card{background:var(--card);border:1px solid #406052;border-radius:16px;padding:16px}h2{margin:0 0 12px;font-size:1.05rem}
    .buttons{display:flex;gap:8px;flex-wrap:wrap}a,button{border:0;border-radius:9px;padding:9px 11px;font:inherit;cursor:pointer;text-decoration:none}
    a{background:var(--green);color:#092014;font-weight:700}button{background:#31443c;color:var(--text)}.help{margin-top:28px;color:var(--muted);line-height:1.55}.help strong{color:var(--text)}code{color:var(--green)}
  </style>
</head>
<body>
  <main>
    <h1>BC Phoenix <span>Spieltage</span></h1>
    <p class="lead">Wähle deine Mannschaft und abonniere ihren Spielplan. Änderungen erscheinen automatisch im Kalender.</p>
    <section class="help">
      <p><strong>iPhone, Outlook oder Apple Kalender:</strong> „Abonnieren“ wählen.</p>
      <p><strong>Android / Google Kalender:</strong> „Link kopieren“ → im Browser <code>calendar.google.com</code> → „Weitere Kalender“ → „Per URL“.</p>
    </section>
    <section id="calendars" class="grid" aria-label="Kalender"></section>

  </main>
  <script>
    const calendars = [
      {name:"1. Mannschaft",ics:"https://calendar.google.com/calendar/ical/15cd780fbc7b2782e9e0ece172846eff4081d6db4abaff94c99bdc1ba9c5aa87@group.calendar.google.com/public/basic.ics"},
      {name:"2. Mannschaft",ics:"https://calendar.google.com/calendar/ical/f34f98308f9ca1f14ec365a9a5b32c34afbb996816a27803b9de3df45c915662@group.calendar.google.com/public/basic.ics"},
      {name:"3. Mannschaft",ics:"https://calendar.google.com/calendar/ical/b2dab573a9d4c4133b56cbe8a716c03aeed139cbc100e08dc506862e6491198d@group.calendar.google.com/public/basic.ics"},
      {name:"4. Mannschaft",ics:"https://calendar.google.com/calendar/ical/67a48247fb224cc1ffbd6b268233e10ecbbdc3ceaf0770a60baae489825111d1@group.calendar.google.com/public/basic.ics"},
      {name:"5. Mannschaft",ics:"https://calendar.google.com/calendar/ical/a478764202d59184a6d9384807552e38a7a8dc44c8bee72782aa709565bb62f7@group.calendar.google.com/public/basic.ics"},
      {name:"Alle Heimspiele",ics:"https://calendar.google.com/calendar/ical/bcphoenix1996@gmail.com/public/basic.ics"}
    ];
    const toWebcal = url => url.replace(/^https?:/,"webcal:");
    document.querySelector("#calendars").innerHTML = calendars.map(({name,ics}) => `<article class="card"><h2>${name}</h2><div class="buttons"><a href="${toWebcal(ics)}">Abonnieren</a><button data-ics="${ics}">Link kopieren</button></div></article>`).join("");
    document.querySelectorAll("[data-ics]").forEach(button => button.onclick = async () => { await navigator.clipboard.writeText(button.dataset.ics); button.textContent="Kopiert"; setTimeout(()=>button.textContent="Link kopieren",1300); });
  </script>
</body>
</html>
